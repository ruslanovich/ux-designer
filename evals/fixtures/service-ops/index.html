<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Desk</title>
<style>*{box-sizing:border-box}body{font:13px Arial;margin:0;color:#666;background:#ededed}header{background:#52505e;color:white;padding:7px}nav{padding:20px;background:#ffc0bc;font-size:19px}main{padding:8px}.tools{background:#dce6dd;padding:4px;display:flex;gap:4px}button,input,select{font:inherit;padding:4px}table{width:1150px;border-collapse:collapse;background:white}th,td{border:1px solid #bbb;padding:3px;text-align:left}th{font-weight:400;color:#aaa}h1,h2{font:14px Arial;margin:5px 0}aside{background:#e5d7fd;padding:6px;margin-top:20px}#result{background:#fff3a2;padding:5px}.saved{margin-top:28px}.links{background:#c3f8eb;padding:5px}#detail{white-space:pre-line}</style>
<header>Service Desk <label>Role <select id="role"><option>dispatcher</option><option>technician</option><option>admin</option></select></label></header><nav>Customers · Operations · Tools · Billing · Misc</nav><main><h1>Operations / Records</h1><div class="tools"><input id="query" aria-label="Search work orders" placeholder="Search"><select id="status" aria-label="Status"><option value="all">All states</option><option>new</option><option>waiting</option><option>scheduled</option><option>draft</option></select><button id="assign">Process selected</button><select id="technician" aria-label="Technician"><option>Lee</option><option>Sam</option></select></div><p id="result" role="status"></p><table><thead><tr><th>Select</th><th>ID</th><th>Title</th><th>Customer</th><th>State</th><th>Technician</th><th>Due</th><th>Info</th></tr></thead><tbody id="rows"></tbody></table><div class="saved"><input id="view-name" aria-label="View name" placeholder="View name"><button id="save-view">Save preset</button><select id="views" aria-label="Saved view"><option value="">Presets</option></select></div><aside><h2>More information</h2><div id="detail">Select an Info action.</div></aside><div class="links"><button id="export">Export CSV</button></div></main><script src="model.js"></script><script src="app.js"></script></html>
