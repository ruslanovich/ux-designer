<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile settings</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;color:#172b3a;background:#f4f6f8;margin:0}header{background:white;border-bottom:1px solid #dbe1e7;padding:16px 24px}main{max-width:640px;margin:32px auto;padding:24px;background:white;border:1px solid #dbe1e7;border-radius:12px}h1{font-size:26px;margin-top:0}label{display:block;font-weight:600;margin-top:16px}input{display:block;width:100%;font:inherit;padding:10px;margin-top:6px;border:1px solid #8a99a7;border-radius:6px}button{font:inherit;padding:10px 16px;margin-top:20px;border:0;border-radius:6px;background:#165acc;color:white}#status{min-height:24px;color:#963720}small{color:#526674}@media(max-width:700px){main{margin:16px;padding:20px}}</style>
<header>Northstar / Settings</header><main><h1>Your profile</h1><p>Choose how your name appears to teammates.</p><form id="profile"><label for="name">Display name</label><input id="name" value="Sam Rivera" required><label for="email">Email</label><input id="email" type="email" value="sam@example.test" required><small>Email is used for account notifications.</small><p id="status" role="status"></p><button id="save">Save changes</button></form></main>
<script>
let attempts = 0;
document.getElementById('profile').onsubmit = e => {
  e.preventDefault();
  attempts++;
  const status = document.getElementById('status');
  const save = document.getElementById('save');

  if (attempts === 1) {
    status.textContent = 'We couldn’t save your changes. Your edits are still here. Please try again.';
    save.textContent = 'Retry save';
  } else {
    status.textContent = 'Changes saved.';
    save.textContent = 'Save changes';
  }
};
</script></html>
