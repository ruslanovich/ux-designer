<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Reading</title>
<style>
*{box-sizing:border-box}body{font:12px Arial;margin:0;background:#e5e5ff;color:#555}header{padding:9px;background:#5a34f4;color:white}h1{font-size:20px;margin:0}.layout{display:flex;gap:3px;padding:8px}.menu{width:190px;flex-shrink:0;background:#caff80;padding:6px}.menu button{display:block;margin:4px;padding:15px;font-size:15px}.work{min-width:800px;flex:1}.banner{background:#ffb17c;font-size:28px;padding:35px;margin-bottom:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.card{background:#fff;padding:6px;border:3px solid #bebeff}.card h2{font-size:12px;font-weight:400;color:#777}.card p{color:#aaa}.card button{background:#6739f5;color:white;border:0;margin:3px;padding:7px;border-radius:20px}.card select{font-size:10px}form{background:#f9ffae;padding:6px;margin-top:12px}input{width:150px;font:inherit;padding:4px}.add{font:10px serif;background:#ddd;border:1px solid #999}#notice{color:#c00}.footer{margin:5px;font-size:10px}
</style>
<header><h1>My Reading</h1></header><div class="layout"><aside class="menu"><button id="active">My books</button><button id="archive">Old things</button><p>Search everywhere</p><input id="search" aria-label="Search titles and authors" placeholder="Search"><p id="count"></p></aside><main class="work"><div class="banner">Welcome back to your reading universe!</div><h2 id="heading">Items</h2><div id="cards" class="cards"></div><form id="add"><span>Title</span><input id="title" aria-label="Title"><span>Author</span><input id="author" aria-label="Author"><button class="add">Add</button><p id="notice" role="alert"></p></form><p class="footer">Saved on this device</p></main></div>
<script src="model.js"></script><script src="app.js"></script></html>
